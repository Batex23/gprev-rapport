<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi GPREV</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  color-scheme:light dark;
  --bg:#edf0f5;--card:#fff;--soft:#f3f5f9;--ink:#14223a;--mut:#5a687d;--line:#d9dfe8;
  --acc:#234f8e;--acc-ink:#fff;--on:#fff;--bad:#b3261e;--ok:#1d7a52;
  --saf:#5a6b8f;--svc:#2f64a3;--att:#1f7f8c;--cours:#1d7a52;--pieces:#b77a0c;--reprise:#c24a26;
  --relcs:#7650a6;--relcg:#55398a;--retour:#4d7d95;--clos:#7b848d;--late:#b3261e;--soon:#b36b00;
  --font:Bahnschrift,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1620;--card:#172130;--soft:#1d293a;--ink:#e6edf6;--mut:#93a2b8;--line:#2a384c;
  --acc:#5b9bf0;--acc-ink:#0b1626;--on:#0e1520;--bad:#ff8a80;--ok:#6fd0a2;
  --saf:#9fb0d4;--svc:#7db0ec;--att:#6fcad6;--cours:#6fd0a2;--pieces:#f0bd55;--reprise:#f08a67;
  --relcs:#bb9be6;--relcg:#a38be0;--retour:#8ec3dc;--clos:#a9b2bb;--late:#ff8a80;--soon:#ffc266;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 var(--font);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}

/* en-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand b{font-size:17px;font-weight:700}
.brand small{color:var(--mut);font-size:13px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .nm{line-height:1.2;text-align:right;min-width:0}
.who .nm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .nm small{color:var(--mut);font-size:12px}
.asel{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 14px;max-width:270px;cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.sim{background:color-mix(in srgb,var(--soon) 15%,var(--card));border-bottom:1px solid color-mix(in srgb,var(--soon) 40%,var(--line));padding:6px 18px;font-size:13px;flex:none}

/* champ de bulles */
.field{display:flex;gap:6px;align-items:flex-start;padding:12px 18px 4px;background:var(--card);overflow-x:auto;flex:none}
.sep{width:1px;align-self:stretch;background:var(--line);margin:8px 10px 24px;flex:none}
.pipe{display:flex;gap:2px;position:relative}
.pipe::before{content:"";position:absolute;left:30px;right:30px;top:59px;border-top:2px dotted var(--line)}
.bub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:max(108px,calc(var(--d) + 14px));flex:none;position:relative;text-align:center;padding-bottom:6px;border-radius:14px}
.bub .wrap{height:118px;width:100%;display:grid;place-items:center;position:relative}
.bub .disc{width:var(--d);height:var(--d);border-radius:50%;display:grid;place-items:center;position:relative;color:var(--c);
  background:color-mix(in srgb,var(--c) 13%,var(--card));border:2px solid color-mix(in srgb,var(--c) 55%,var(--card));transition:transform .18s,background .18s,box-shadow .18s}
.bub .disc b{font-size:calc(var(--d) * .38);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bub:hover .disc{transform:scale(1.05)}
.bub[aria-pressed=true] .disc{background:var(--c);border-color:var(--c);color:var(--on);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 38%,transparent)}
.bub.zero .disc{opacity:.45}
.bub:focus-visible .disc{outline:3px solid var(--acc);outline-offset:3px}
.bub .lbl{font-size:12.5px;line-height:1.2;font-weight:600;max-width:100px}
.bub .lt,.sb .lt{position:absolute;top:-5px;right:-5px;min-width:22px;height:22px;border-radius:11px;background:var(--late);color:var(--on);font:700 12px/22px var(--font);text-align:center;padding:0 5px;border:2px solid var(--card);font-style:normal}
.bub.bump .disc{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.14)}}
.intro .bub{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) backwards;animation-delay:calc(var(--i) * 55ms)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
[data-k=saf]{--c:var(--saf)}[data-k=svc]{--c:var(--svc)}[data-k=att]{--c:var(--att)}[data-k=cours]{--c:var(--cours)}
[data-k=pieces]{--c:var(--pieces)}[data-k=reprise]{--c:var(--reprise)}[data-k=relcs]{--c:var(--relcs)}[data-k=relcg]{--c:var(--relcg)}
[data-k=retour]{--c:var(--retour)}[data-k=clos]{--c:var(--clos)}[data-k=late]{--c:var(--late)}[data-k=soon]{--c:var(--soon)}

.sub{display:flex;gap:10px;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:8px 18px 12px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.sub .sl{color:var(--mut);font-size:12.5px;margin-right:4px;flex:none;white-space:nowrap}
.sb{all:unset;box-sizing:border-box;flex:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--soft);font-size:13px;font-weight:600;position:relative}
.sb .tot{color:var(--mut);font-weight:500;font-size:12px;margin-left:-3px}
.sb[aria-pressed=true] .tot{color:inherit;opacity:.8}
.itab .num{text-align:right;white-space:nowrap}
.dh{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.dh h2{margin:0;font-size:20px}
.dh select{width:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--soft);color:var(--ink)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}.kp b{display:block;font-size:26px;line-height:1.1}.kp span{color:var(--mut);font-size:12.5px}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}.dc h3{margin:0 0 8px;font-size:14px}.dc.w{grid-column:1/-1}
.br{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:8px;align-items:center;font-size:12.5px;padding:2px 0;cursor:default}
.br[data-who]{cursor:pointer}.br[data-who]:hover .bl{color:var(--acc)}.br.on .bl{font-weight:700;color:var(--acc)}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bt{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft)}.bt i{display:block;height:100%}.br b{text-align:right}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mut);margin:0 0 6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.mo{display:flex;gap:6px;align-items:flex-end;height:130px}.mo div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11.5px;color:var(--mut);gap:3px}.mo i{width:100%;background:var(--acc);border-radius:5px 5px 0 0;min-height:2px}.mo em{font-style:normal;color:var(--ink);font-weight:600}
.cnts{display:flex;gap:14px;flex-wrap:wrap}.cnt{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:6px 10px}.cnt span{color:var(--mut);font-size:12.5px}.cnt b{font-size:18px;min-width:20px;text-align:center}.cnt .btn{padding:3px 10px}
[data-k=sclate]{--c:var(--reprise)}[data-k=sc]{--c:var(--svc)}
.dashfull .list{display:none}.dashfull .cols{grid-template-columns:1fr}.itab tr.on td{background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.mo i{min-width:0}
.mv{cursor:pointer;color:var(--mut);font-size:11px;padding:0 2px;user-select:none}.mv:hover{color:var(--acc)}.ordc{white-space:nowrap}tr[draggable=true]{cursor:grab!important}.itab tr.ovr td{background:color-mix(in srgb,var(--acc) 18%,var(--card));box-shadow:inset 0 2px 0 var(--acc)}
.more{display:block;margin:10px auto}
.sb:hover{border-color:var(--acc)}
.sb b{background:var(--ink);color:var(--card);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px;padding:0 6px}
.sb[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sb[aria-pressed=true] b{background:var(--acc-ink);color:var(--acc)}
.sb .lt{top:-6px;right:-4px;min-width:18px;height:18px;line-height:18px;font-size:11px}

/* colonnes */
.cols{flex:1;display:grid;grid-template-columns:minmax(300px,410px) 1fr;min-height:0}
.list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
.tools .btn{flex:1;justify-content:center}
.tools{padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);background:var(--card)}
.tools input[type=search]{flex:1 1 100%;min-width:140px;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:7px 11px}
.cards{overflow:auto;flex:1;padding:10px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
.card.flash{animation:fl 3.2s ease-out}
@keyframes fl{0%{background:color-mix(in srgb,var(--soon) 30%,var(--card))}100%{background:var(--card)}}
.c-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.c-name{font-weight:650;font-size:13.5px;overflow-wrap:anywhere}
.c-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center;font-size:12px;color:var(--mut)}
.pas{font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pas.ok{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok)}
.pas.soon{background:color-mix(in srgb,var(--soon) 16%,var(--card));color:var(--soon)}
.pas.bad{background:var(--late);color:var(--on)}
.pas.na{background:var(--soft);color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-weight:600;font-size:12px;color:var(--c,var(--mut));background:color-mix(in srgb,var(--c,var(--mut)) 13%,var(--card))}
.chip{display:inline-flex;align-items:center;gap:5px}
.chip .av{width:20px;height:20px;font-size:9px}
.mini{padding:1px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink)}
.mini.hot{background:color-mix(in srgb,var(--reprise) 14%,var(--card));border-color:color-mix(in srgb,var(--reprise) 45%,var(--line));color:var(--reprise)}
.empty{color:var(--mut);text-align:center;padding:36px 16px}

/* détail */
.detail{overflow:auto;padding:18px 22px 40px;min-width:0}
.sheet{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.box h3{margin:0 0 12px;font-size:13.5px;font-weight:700;color:var(--mut)}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.head h2{margin:0 0 8px;font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.head .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.head a{color:var(--acc);font-weight:600;text-decoration:none}
.head a:hover{text-decoration:underline}
.cd{width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;text-align:center;line-height:1.05;color:var(--c);border:3px solid var(--c);background:color-mix(in srgb,var(--c) 11%,var(--card))}
.cd b{font-size:26px;display:block;font-variant-numeric:tabular-nums}
.cd small{font-size:11px;color:var(--mut)}
.cd.ok{--c:var(--ok)}.cd.soon{--c:var(--soon)}.cd.bad{--c:var(--late)}.cd.na{--c:var(--clos)}
.track{display:flex;margin:16px 0 2px}
.tk{flex:1;text-align:center;position:relative;font-size:11.5px;color:var(--mut);padding:0 2px}
.tk i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 6px;background:var(--line);position:relative;z-index:1}
.tk::before{content:"";position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--line)}
.tk:first-child::before{display:none}
.tk.done i,.tk.done::before,.tk.cur::before{background:var(--c)}
.tk.cur i{background:var(--card);border:3px solid var(--c);width:18px;height:18px;margin-top:-2px;margin-bottom:4px}
.tk.cur{color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 18px}
.fld{min-width:0}.fld.w{grid-column:span 2}
.fld>span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.fld .val{padding:5px 0;font-weight:600;min-height:30px;overflow-wrap:anywhere}
.fld input,.fld select{width:100%;border:1px solid transparent;border-bottom-color:var(--line);background:transparent;border-radius:8px;padding:5px 8px;margin-left:-8px;width:calc(100% + 8px);font-weight:600}
.fld input:hover,.fld select:hover{background:var(--soft)}
.fld input:focus,.fld select:focus{background:var(--card);border-color:var(--acc);outline:none}
.fld input[type=checkbox]{width:18px;height:18px;margin:6px 0 0}
.note{color:var(--mut);font-size:12.5px;margin-top:10px}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.acts .grp{display:flex;flex-direction:column;gap:4px}
.acts label{font-size:12px;color:var(--mut)}
.acts select,.acts input[type=text],.acts input:not([type]){border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--soft);min-width:170px}
.box.todo{border-color:color-mix(in srgb,var(--acc) 55%,var(--line));border-left-width:5px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:650;font-size:13px;display:inline-flex;gap:7px;align-items:center}
.btn:hover{background:var(--soft)}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.btn.p:hover{filter:brightness(1.08)}
.btn.d{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg,.ico{width:15px;height:15px;flex:none}
.load{width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.load table{width:100%;border-collapse:collapse;font-size:13px}
.load th{font-weight:600;color:var(--mut);background:var(--soft);padding:6px 10px;text-align:center}
.load td{padding:6px 10px;text-align:center;border-top:1px solid var(--line)}
.load td:first-child,.load th:first-child{text-align:left}
.load tr.pick{cursor:pointer}.load tr.pick:hover td{background:var(--soft)}
.load .n{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:13px;background:var(--soft);font-weight:700}
.load .n.w{background:color-mix(in srgb,var(--soon) 20%,var(--card));color:var(--soon)}
.cm{padding:9px 12px;border-radius:12px;background:var(--soft);margin-bottom:8px}
.cm.imp{background:color-mix(in srgb,var(--late) 10%,var(--card));border:1px solid color-mix(in srgb,var(--late) 35%,var(--line))}
.cm .mh{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mut);margin-bottom:3px}
.cm .mh b{color:var(--ink)}
.cm div:last-child{white-space:pre-wrap;overflow-wrap:anywhere}
.composer{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.composer textarea,.mbox textarea,.mbox input:not([type=checkbox]),.mbox select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--soft)}
.composer .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{display:none}

/* fenêtres */
#modal{position:fixed;inset:0;background:rgba(8,14,26,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
#modal.on{display:flex}
.mbox{background:var(--card);border-radius:18px;width:min(1120px,100%);max-height:94vh;overflow:auto;padding:22px}
.mbox.sm{width:min(620px,100%)}
.mbox h2{margin:0 0 14px;font-size:19px}
.mbox .lb{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 3px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}
.mact{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.drop{border:2px dashed var(--line);border-radius:16px;padding:30px;text-align:center;cursor:pointer;background:var(--soft)}
.drop:hover,.drop.on{border-color:var(--acc)}
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.sumrow .pill{font-size:13px;padding:4px 12px}
.itw{overflow:auto;max-height:52vh;border:1px solid var(--line);border-radius:12px}
.itab{border-collapse:collapse;width:100%;font-size:12.5px}
.itab th{position:sticky;top:0;background:var(--soft);text-align:left;padding:7px 8px;font-weight:600;color:var(--mut);white-space:nowrap;z-index:1}
.itab td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:middle}
.itab input:not([type=checkbox]),.itab select{width:100%;min-width:90px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--card);font-size:12.5px}
.itab input.warn{border-color:var(--soon);background:color-mix(in srgb,var(--soon) 12%,var(--card))}
.itab tr.off td{opacity:.45}
.itab .nmc{font-weight:650;min-width:240px;overflow-wrap:anywhere}
.itab .fl{color:var(--soon);font-size:12px;font-weight:500;margin-top:2px}
.itab select{min-width:112px}
.itab select[data-c=Statut]{min-width:170px}
.itab .fl.dup{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:80;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--late);color:var(--on)}

@media (max-width:900px){
  .cols{grid-template-columns:1fr}
  .list{border-right:0}
  body.has-sel .list{display:none}
  body:not(.has-sel):not(.dash) .detail{display:none}
  .back{display:inline-flex;margin-bottom:10px}
  .fld.w{grid-column:span 1}
  .tk:not(.cur) span{display:none}
  .mgrid{grid-template-columns:1fr}
  .who .nm{display:none}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="34" height="30" viewBox="0 0 34 30" aria-hidden="true"><circle cx="11" cy="17" r="10" fill="var(--svc)" opacity=".9"/><circle cx="22" cy="11" r="8" fill="var(--reprise)" opacity=".9"/><circle cx="25" cy="21" r="6" fill="var(--cours)" opacity=".9"/></svg>
    <div><b>Suivi des dossiers</b> <small>GPREV</small></div>
  </div>
  <div class="who" id="who"><span class="nm"><small>Identification…</small></span></div>
</header>
<div class="sim" id="simbar" hidden></div>
<div class="sim" id="warnbar" hidden style="background:color-mix(in srgb,var(--late) 12%,var(--card));border-color:var(--late)"></div>
<section class="field" id="field" aria-label="Dossiers par étape"></section>
<section class="sub" id="sub" hidden></section>

<main class="cols">
  <aside class="list">
    <div class="tools">
      <input type="search" id="q" placeholder="Rechercher un dossier" aria-label="Rechercher un dossier">
      <button class="btn p" id="bNew" hidden></button>
      <button class="btn" id="bImp" hidden></button>
      <button class="btn" id="bSC" hidden></button>
      <button class="btn" id="bStat">Statistiques</button>
    </div>
    <div class="cards" id="cards"></div>
  </aside>
  <section class="detail" id="detail"></section>
</main>

<div id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ CONSTANTES ============ */
const T={P:'Personnel_du_GPREV',I:'Identite',C:'Commentaires',S:'Sous_Commissions',D:'Dossiers'};
const STAGES=[
 {k:'saf',st:'Reçu SAF',l:'Reçus au SAF'},
 {k:'svc',st:'Attribué service',l:'À répartir (service)'},
 {k:'att',st:'En attente agent',l:'En attente agent'},
 {k:'cours',st:'En cours',l:'En cours'},
 {k:'pieces',st:'Attente pièces',l:'Attente de pièces'},
 {k:'reprise',st:'À reprendre',l:'À reprendre'},
 {k:'relcs',st:'Relecture chef de service',l:'Relecture service'},
 {k:'relcg',st:'Relecture chef de groupement',l:'Relecture groupement'},
 {k:'retour',st:'Retour SAF',l:'Retour SAF'},
 {k:'clos',st:'Clôturé',l:'Clôturés'}];
const KOF={};STAGES.forEach(s=>KOF[s.st]=s.k);
const SLAB={};STAGES.forEach(s=>SLAB[s.k]=s.l);SLAB.all='Tous les dossiers en cours';SLAB.late='En retard';SLAB.sc='Dossiers qui passent en sous-commission';SLAB.sclate='En retard avant la sous-commission';SLAB.soon='À échéance sous 7 jours';
const ACTIVE=['En attente agent','En cours','Attente pièces','À reprendre'];
const STEPS=[['Reçu','saf'],['Service','svc'],['Agent','att'],['Instruction','cours'],['Relecture service','relcs'],['Relecture groupement','relcg'],['Retour SAF','retour'],['Clôturé','clos']];
const STEP_OF={'Reçu SAF':0,'Attribué service':1,'En attente agent':2,'En cours':3,'Attente pièces':3,'À reprendre':3,'Relecture chef de service':4,'Relecture chef de groupement':5,'Retour SAF':6,'Clôturé':7};
const FIELDS=[
 {k:'Numero_AIRS',l:'N° AIRS (vide = DEMAT)',t:'txt'},
 {k:'Ville',l:'Ville',t:'txt'},
 {k:'Etablissement',l:'Établissement / nom du dossier',t:'txt',w:1},
 {k:'Numero_Urbanisme',l:'N° urbanisme (avec M01 si modificatif)',t:'txt'},
 {k:'Nature',l:'Nature de l’étude',t:'sel',o:['ERP','Habitation','Code du travail']},
 {k:'Avec_Habitation',l:'ERP avec habitation',t:'bool'},
 {k:'Categorie',l:'Catégorie',t:'sel',o:['','1','2','3','4','5','5 < 20']},
 {k:'Date_Arrivee',l:'Arrivée au SDIS',t:'date'},
 {k:'Avis',l:'Avis',t:'sel',o:['','Favorable','Défavorable']},
 {k:'Lien_Prevarisc',l:'Lien Prevarisc',t:'url',w:1}];
const FD={};FIELDS.forEach(f=>FD[f.k]=f);
const IDF=['Source','Numero_AIRS','Ville','Etablissement','Numero_Urbanisme','Modificatif','Nature','Avec_Habitation','Categorie','Lien_Prevarisc'];
const OWNER={id:0,NOM:'Propriétaire',Prenom:'',Grade:'',Service:'Encadrement',Role_hierarchique:1,isOwner:true};

/* ============ ÉTAT ============ */
const S={repV:{},recs:[],pers:{},scs:{},comsAll:[],me:null,owner:false,as:0,stage:'all',who:null,q:'',sel:null,limit:200,sp:'year',
  draft:{},prev:{},sig:{},mine:{},flash:{},comSig:'',intro:false,pending:false,ready:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const svcN=s=>String(s||'').startsWith('Chargé')?'CM':String(s||'');
const todayU=()=>{const d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/1000};
const fd=t=>t?new Date(t*1000).toLocaleDateString('fr-FR',{timeZone:'UTC'}):'—';
const iso=t=>t?new Date(t*1000).toISOString().slice(0,10):'';
const echOf=r=>{if(r.Date_Arrivee){const sc=r.Sous_Commission&&S.scs[r.Sous_Commission];return calcEch({Date_Arrivee:r.Date_Arrivee,Nature:r.Nature,Avec_Habitation:r.Avec_Habitation,scDate:sc?sc.Date:null})}return r.Echeance||null};
const jours=r=>{const e=echOf(r);return e?Math.round((e-todayU())/86400):null};
const DATECOLS=['Date_Arrivee','Date_Attribution_Agent','Date_Termine_Agent','Date_Cloture'];
function dnum(v){if(v instanceof Date)return isNaN(v)?null:Math.floor(v.getTime()/1000);if(typeof v=='string')return parseDate(v);if(typeof v=='number'&&v>1e11)return Math.floor(v/1000);return v}
function normDates(r){DATECOLS.concat('Echeance').forEach(c=>{if(c in r)r[c]=dnum(r[c])})}
const plabel=p=>p?`${p.Grade?p.Grade+' ':''}${p.NOM} ${p.Prenom||''}`.trim():'—';
const nom=id=>id==0||id==null?(id===0?'Propriétaire':'—'):(S.pers[id]?`${S.pers[id].NOM} ${S.pers[id].Prenom||''}`.trim():'—');
const ini=p=>((p.Prenom||'')[0]||'')+((p.NOM||'')[0]||'');
const avatar=p=>`<span class="av" style="background:hsl(${((p.id||0)*47)%360} 36% 40%)">${esc(ini(p).toUpperCase())}</span>`;
function ico(n){const P={plus:'M12 5v14M5 12h14',up:'M12 16V4m0 0L7 9m5-5 5 5M5 20h14',cal:'M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1z',msg:'M4 5h16v11H9l-5 4z',chk:'M5 12l5 5 9-10',back:'M15 5l-7 7 7 7'};return `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`}
function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast'+(err?' err':'');t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,err?5000:1800)}

/* ============ GRIST ============ */
const act=(...a)=>grist.docApi.applyUserActions(a);
function rowsOf(t){const k=Object.keys(t).filter(x=>x!='id');return t.id.map((id,i)=>{const o={id};k.forEach(c=>o[c]=t[c][i]);return o})}
grist.ready({requiredAccess:'full',allowSelectBy:true});
grist.onRecords(async rs=>{
  trackChanges(rs);S.recs=rs;
  if(!S.ready){S.ready=true;await init()}
  rs.forEach(normAgent);rs.forEach(normDates);
  if(!S.first){S.first=true;render()}else renderSoon();
},{includeColumns:'all'});

let rT=0;const renderSoon=()=>{clearTimeout(rT);rT=setTimeout(render,150)};
const refId=v=>{if(v==null||typeof v=='number')return v;
  if(Array.isArray(v)&&v[0]=='R')return +v[2]||0;
  if(typeof v=='object'){if('rowId' in v)return +v.rowId||0;if('id' in v)return +v.id||0;v=String(v)}
  if(typeof v=='string'){const m=v.trim().match(/^\w+\[(\d+)\]$/);if(m)return +m[1]}return v};
function normAgent(r){r.Agent_Assigne=refId(r.Agent_Assigne);r.Sous_Commission=refId(r.Sous_Commission);if(typeof r.Sous_Commission=='string')r.Sous_Commission=0;const v=r.Agent_Assigne;
  if(typeof v=='string'&&v.trim()){if(/^\d+$/.test(v.trim()))r.Agent_Assigne=+v;else{const p=findAgent(v);r._agentTxt=v;r.Agent_Assigne=p?p.id:0}}}
const OPTCOLS=['Ordre_SC','Cle_Import','Code_Etab','Type_ERP','Avis_Commission','Objet','Retour_Groupement'];
const COLTYPE=()=>({Avec_Habitation:'Bool',Pieces_Reseau:'Bool',Retour_Groupement:'Bool',Date_Arrivee:'Date',Date_Attribution_Agent:'Date',Date_Termine_Agent:'Date',Date_Cloture:'Date',Ordre_SC:'Int',Nb_Derogations:'Int',Nb_Demandes_Avis:'Int',Sous_Commission:'Ref:'+T.S,Agent_Assigne:'Ref:'+T.P});
async function mkCols(){const mc=missingCols().concat(OPTCOLS.filter(c=>!dcols().includes(c))).filter(c=>c!='Nom_Dossier'&&c!='Echeance'),ty=COLTYPE();
  try{for(const c of mc)await act(['AddColumn',T.D,c,{type:ty[c]||'Text',isFormula:false}]);toast(mc.length+' colonnes créées')}catch(e){toast('Création refusée : '+(e.message||e)+'. Créez-les à la main.',true)}}
const NEEDED=['Numero_Courrier','Source','Numero_AIRS','Ville','Etablissement','Numero_Urbanisme','Modificatif','Nature','Avec_Habitation','Categorie','Date_Arrivee','Service_Attribue','Agent_Assigne','Statut','Avis','Sous_Commission','Pieces_Reseau','Nb_Derogations','Nb_Demandes_Avis','Lien_Prevarisc','Date_Attribution_Agent','Date_Termine_Agent','Date_Cloture','Nom_Dossier','Echeance'];
function missingCols(){const c=dcols();return c.length?NEEDED.filter(x=>!c.includes(x)):[]}
async function fixTypes(){try{for(const c of wrongTypes())await act(['ModifyColumn',T.D,c,{type:'Date'}]);toast('Types corrigés. Réimportez le fichier pour remplir les dates.');setTimeout(discover,500)}catch(e){toast('Correction refusée : '+(e.message||e),true)}}
const wrongTypes=()=>DATECOLS.filter(c=>S.colTypes&&S.colTypes[c]&&!/^Date/.test(S.colTypes[c]));
const COMCOLS=['Dossier','Auteur','Date','Texte','Important'];
async function mkCom(){try{if(!S.comOk)await act(['AddTable',T.C,[{id:'Dossier',type:'Ref:'+T.D},{id:'Auteur',type:'Ref:'+T.P},{id:'Date',type:'DateTime:Europe/Paris'},{id:'Texte',type:'Text'},{id:'Important',type:'Bool'}]]);
  else for(const c of COMCOLS.filter(c=>!S.comCols.includes(c)))await act(['AddColumn',T.C,c,{type:c=='Dossier'?'Ref:'+T.D:c=='Auteur'?'Ref:'+T.P:c=='Date'?'DateTime:Europe/Paris':c=='Important'?'Bool':'Text',isFormula:false}]);
  toast('Table des commentaires prête');await discover();loadComs();checkAgents()}catch(e){toast('Création refusée : '+(e.message||e),true)}}
function checkAgents(){const cm=S.comOk===false||(S.comCols&&S.comOk&&COMCOLS.some(c=>!S.comCols.includes(c)));
  if(cm&&!wrongTypes().length&&!missingCols().length){const w=$('warnbar');w.hidden=false;
    w.innerHTML=S.comOk?`La table <b>${esc(T.C)}</b> n’a pas toutes ses colonnes (manque : <b>${COMCOLS.filter(c=>!S.comCols.includes(c)).join(', ')}</b>). Les commentaires et les renvois à l’agent échouent. <button class="btn p" id="mkCom" style="margin-left:8px">Créer les colonnes</button>`:`Aucune table de commentaires trouvée dans le document. Les commentaires et les renvois à l’agent échouent. <button class="btn p" id="mkCom" style="margin-left:8px">Créer la table Commentaires</button>`;$('mkCom').onclick=mkCom;return}
  checkAgents0()}
function checkAgents0(){const wt=wrongTypes();if(wt.length){const w=$('warnbar');w.hidden=false;
  w.innerHTML=`Les colonnes <b>${wt.join(', ')}</b> ne sont pas de type <b>Date</b> (actuellement ${esc(S.colTypes[wt[0]])}) : les dates ne s’affichent pas. <button class="btn p" id="fxT" style="margin-left:8px">Passer en type Date</button>`;$('fxT').onclick=fixTypes;return}
  const mc=missingCols();if(mc.length){const w=$('warnbar');w.hidden=false;
  w.innerHTML=`Colonnes absentes de la table <b>Dossiers</b> : <b>${mc.map(esc).join(', ')}</b>. Sans elles, la saisie, l’import, les échéances et les statistiques ne fonctionnent pas. <button class="btn p" id="mkCols" style="margin-left:8px">Créer les colonnes manquantes</button>`;$('mkCols').onclick=mkCols;return}
  checkAgents2()}
function checkAgents2(){const bad=S.recs.filter(r=>real(r)&&r.Agent_Assigne&&!S.pers[r.Agent_Assigne]),w=$('warnbar');
  if(!bad.length&&!S.recs.some(r=>r._agentTxt&&!r.Agent_Assigne)){relBanner(w);return}
  const ex=bad[0]?bad[0].Agent_Assigne:(S.recs.find(r=>r._agentTxt&&!r.Agent_Assigne)||{})._agentTxt;
  w.hidden=false;w.innerHTML=`Attention : ${bad.length||'des'} dossier(s) ont un agent introuvable dans la table « ${esc(T.P)} » (exemple : « ${esc(ex)} »). Vérifiez que la colonne <b>Agent_Assigne</b> est de type Référence vers cette table.`}
function trackChanges(rs){
  rs.forEach(r=>{const g=[r.Statut,r.Agent_Assigne,r.Date_Arrivee,r.Nom_Dossier,r.Sous_Commission].join('|');
    if(S.sig[r.id]!==undefined&&S.sig[r.id]!==g&&Date.now()-(S.mine[r.id]||0)>2500){S.flash[r.id]=Date.now();
      if(r.id==S.sel)toast('Ce dossier vient d’être mis à jour par un collègue')}
    S.sig[r.id]=g});
}
/* repère la vraie table « Personnel » d'après le type de la colonne Agent_Assigne */
async function discover(){
  try{
    const tb=rowsOf(await grist.docApi.fetchTable('_grist_Tables')),cl=rowsOf(await grist.docApi.fetchTable('_grist_Tables_column')),tid={};
    tb.forEach(t=>tid[t.id]=t.tableId);
    S.metaCols=cl.filter(x=>tid[x.parentId]==T.D).map(x=>x.colId);
    const ids=tb.map(t=>t.tableId).filter(x=>!/^_grist/.test(x)),fnd=re=>ids.find(x=>re.test(norm(x)));
    S.tables=ids;T.C=fnd(/^commentaire/)||T.C;T.S=fnd(/^souscommission/)||T.S;T.I=fnd(/^identit/)||T.I;S.comOk=ids.includes(T.C);
    S.comCols=cl.filter(x=>tid[x.parentId]==T.C).map(x=>x.colId);
    S.colTypes={};cl.filter(x=>tid[x.parentId]==T.D).forEach(x=>S.colTypes[x.colId]=String(x.type));
    const a=cl.find(x=>tid[x.parentId]==T.D&&x.colId=='Agent_Assigne');S.agentType=a?String(a.type):'';
    const m=/^Ref:(.+)$/.exec(S.agentType);if(m)T.P=m[1];
  }catch(e){console.warn('métadonnées inaccessibles',e)}
}
const dcols=()=>S.recs.length?Object.keys(S.recs[0]):(S.metaCols||[]);
async function loadPers(){const o={};try{rowsOf(await grist.docApi.fetchTable(T.P)).forEach(p=>o[p.id]=p)}catch(e){console.error(e)}return o}
async function init(){
  await discover();
  S.pers=await loadPers();
  if(!Object.keys(S.pers).length){
    try{for(const t of await grist.docApi.listTables()){if(!/personnel/i.test(t))continue;const x=await grist.docApi.fetchTable(t);if('NOM' in x&&x.id.length){T.P=t;S.pers=await loadPers();break}}}catch(e){}}
  let ident=[];try{ident=rowsOf(await grist.docApi.fetchTable(T.I))}catch(e){console.error(e)}
  if(ident.length>1){S.owner=true;try{S.as=+sessionStorage.getItem('gprev_as')||0}catch(e){}}
  else if(ident.length==1)S.me=S.pers[ident[0].Personnel]||null;
  await loadSC();await loadComs();await loadRep();
  setInterval(poll,5000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
}
async function loadSC(){const o={};try{rowsOf(await grist.docApi.fetchTable(T.S)).forEach(s=>o[s.id]=s)}catch(e){}S.scs=o}
async function loadComs(){try{S.comsAll=rowsOf(await grist.docApi.fetchTable(T.C))}catch(e){S.comsAll=[]}
  const sg=S.comsAll.map(c=>c.id+':'+(c.Texte||'').length+':'+c.Dossier).join(',');const ch=sg!==S.comSig;S.comSig=sg;return ch}
async function poll(){if(document.hidden)return;const ch=await loadComs();await loadSC();await loadRep();if(ch){renderList();if(S.sel)renderComs()}}

/* ============ IDENTITÉ ET DROITS ============ */
function actor(){if(S.owner)return S.as&&S.pers[S.as]?S.pers[S.as]:OWNER;return S.me||null}
const roleN=a=>a?(parseInt(a.Role_hierarchique)||0):0;
const isGrp=a=>!!a&&(a.isOwner||[1,2].includes(roleN(a)));
const isChef=a=>!!a&&roleN(a)==3&&!a.isOwner;
const isSAF=a=>!!a&&a.Service=='SAF';
function canSee(r,a){
  if(!a)return false;if(isGrp(a))return true;
  if(isSAF(a)&&['Reçu SAF','Retour SAF','Clôturé'].includes(r.Statut))return true;
  if(isSAF(a)&&r.Sous_Commission)return true;
  if(isChef(a)&&svcN(r.Service_Attribue)==svcN(a.Service)&&r.Service_Attribue)return true;
  return !!r.Agent_Assigne&&r.Agent_Assigne==a.id;
}
function editable(k,r){const a=actor();if(!a)return false;if(isGrp(a))return true;
  if(isChef(a)&&r.Service_Attribue&&svcN(r.Service_Attribue)==svcN(a.Service))return true;
  if(isSAF(a)&&['Reçu SAF','Retour SAF'].includes(r.Statut))return IDF.includes(k)||k=='Date_Arrivee';
  if(r.Agent_Assigne&&r.Agent_Assigne==a.id&&ACTIVE.includes(r.Statut))return IDF.includes(k)||['Nb_Derogations','Nb_Demandes_Avis','Avis'].includes(k);
  return false}
const real=r=>r.Statut||r.Etablissement||r.Numero_Urbanisme||r.Ville;
const stageOf=r=>KOF[r.Statut]||'saf';
function pool(){const a=actor();return S.recs.filter(r=>real(r)&&canSee(r,a))}
function inStage(r){const k=stageOf(r),j=jours(r);
  if(S.stage=='all')return k!='clos';
  if(S.stage=='sc')return scUp(r);
  if(S.stage=='sclate')return scLate(r);
  if(S.stage=='late')return k!='clos'&&j!=null&&j<0;
  if(S.stage=='soon')return k!='clos'&&j!=null&&j>=0&&j<=7;
  return k==S.stage}
const gkey=r=>r.Agent_Assigne?'a'+r.Agent_Assigne:'s'+(r.Service_Attribue||'');
const fullName=p=>p?String(p.Concact||'').trim()||plabel(p):'';
const glabel=k=>k[0]=='a'?(fullName(S.pers[+k.slice(1)])||('Agent '+k.slice(1))):(k.slice(1)||'Non attribué');
function shown(){const q=norm(S.q);
  return pool().filter(inStage).filter(r=>!S.who||gkey(r)==S.who)
   .filter(r=>!q||norm([r.Nom_Dossier,r.Etablissement,r.Ville,r.Numero_Urbanisme,r.Numero_AIRS].join(' ')).includes(q))
   .sort((a,b)=>(jours(a)??9e9)-(jours(b)??9e9))}

/* ============ RENDU : EN-TÊTE ============ */
function renderWho(){
  const a=actor(),w=$('who');
  if(S.owner){
    const by={};Object.values(S.pers).forEach(p=>(by[p.Service||'Autres']=by[p.Service||'Autres']||[]).push(p));
    const og=Object.keys(by).map(s=>`<optgroup label="${esc(s)}">${by[s].sort((x,y)=>(x.Role_hierarchique-y.Role_hierarchique)||x.NOM.localeCompare(y.NOM)).map(p=>`<option value="${p.id}" ${p.id==S.as?'selected':''}>${esc(plabel(p))}</option>`).join('')}</optgroup>`).join('');
    w.innerHTML=`<span class="nm"><b>Mode propriétaire</b><small>Voir en tant que</small></span>
      <select class="asel" id="asel" aria-label="Voir en tant que"><option value="0" ${!S.as?'selected':''}>Moi : vue complète</option>${og}</select>`;
    $('asel').onchange=e=>{S.as=+e.target.value;try{sessionStorage.setItem('gprev_as',S.as)}catch(x){}S.sel=null;S.who=null;S.stage='all';render()};
    const sb=$('simbar');
    if(S.as&&a&&!a.isOwner){sb.hidden=false;sb.innerHTML=`Vue simulée : <b>${esc(plabel(a))}</b> (${esc(a.Service||'')}). Les données sont affichées comme cette personne les verrait. Vos actions sont enregistrées avec vos droits de propriétaire.`}
    else sb.hidden=true;
  }else if(a){
    w.innerHTML=`<span class="nm"><b>${esc(plabel(a))}</b><small>${esc(a.Service||'')}</small></span>${avatar(a)}`;
  }else{
    w.innerHTML=`<span class="nm"><b>Utilisateur non reconnu</b><small>Vérifier le mail dans Personnel et la table Identite</small></span>`;
  }
  const g=isGrp(a),sa=isSAF(a);
  $('bNew').hidden=!(g||sa);$('bImp').hidden=!(g||sa);$('bSC').hidden=!g;
  $('bNew').innerHTML=ico('plus')+'Nouveau';$('bImp').innerHTML=ico('up')+'Importer';$('bSC').innerHTML=ico('cal')+'Séances';
}

/* ============ RENDU : BULLES ============ */
function visStages(){const a=actor();if(!a||isGrp(a))return STAGES.map(s=>s.k);
  if(isSAF(a))return['saf','retour','clos'];if(isChef(a))return STAGES.map(s=>s.k).filter(k=>k!='saf');return STAGES.map(s=>s.k).filter(k=>k!='saf'&&k!='svc')}
const scLate=r=>{if(['Retour SAF','Clôturé'].includes(r.Statut)||!r.Sous_Commission)return false;const sc=S.scs[r.Sous_Commission];return !!sc&&sc.Date-14*86400<todayU()};
function renderField(){
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.key:null;
  const pl=pool(),cnt={},late={};STAGES.forEach(s=>{cnt[s.k]=0;late[s.k]=0});let nl=0,ns=0,nsc=0;const VS=visStages();if(S.stage!='all'&&!['late','soon','sclate','sc'].includes(S.stage)&&!VS.includes(S.stage))S.stage='all';
  pl.forEach(r=>{const k=stageOf(r);cnt[k]++;if(scLate(r))nsc++;const j=jours(r);if(k!='clos'&&j!=null){if(j<0){late[k]++;nl++}else if(j<=7)ns++}});
  const size=n=>n?Math.min(112,Math.round(52+13*Math.sqrt(n))):50;
  let i=0;
  const bub=(k,n,l,lt)=>{const bump=S.prev[k]!==undefined&&S.prev[k]!==n;S.prev[k]=n;
    return `<button class="bub ${n?'':'zero'} ${bump?'bump':''}" data-k="${k}" data-key="${k}" style="--d:${size(n)}px;--i:${i++}" aria-pressed="${S.stage==k}" title="${esc(l)} : ${n}">
      <span class="wrap"><span class="disc"><b>${n}</b>${lt?`<i class="lt" title="${lt} en retard">${lt}</i>`:''}</span></span><span class="lbl">${esc(l)}</span></button>`};
  const el=$('field');

/* ============ RAPPORT (.odt) — partagé avec le widget Rapport ============ */
const RT={V:'Rapports_Versions',R:'Rapports_Remarques',F:'Rapports_Fichiers'};
const RTYPES=['Oubli de réglementation / prescription','Erreur de calcul d’effectif','Erreur de classement (type, catégorie)','Rédaction / mise en forme','Autre'];
async function loadRep(){try{const t=await grist.docApi.fetchTable(RT.V),o={};t.id.forEach((x,i)=>{const d=refId(t.Dossier[i]);o[d]=Math.max(o[d]||0,+t.Numero[i]||0)});S.repV=o}catch(e){S.repV={}}}
function b64(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
async function repTables(){const ids=await grist.docApi.listTables();
  if(!ids.includes(RT.V))await act(['AddTable',RT.V,[{id:'Dossier',type:'Ref:'+T.D},{id:'Numero',type:'Int'},{id:'Etape',type:'Text'},{id:'Auteur',type:'Ref:'+T.P},{id:'Date',type:'DateTime:Europe/Paris'},{id:'Nb_Commentaires',type:'Int'},{id:'Nb_Modifs_Suivies',type:'Int'},{id:'Note',type:'Text'}]]);
  if(!ids.includes(RT.R))await act(['AddTable',RT.R,[{id:'Dossier',type:'Ref:'+T.D},{id:'Version',type:'Ref:'+RT.V},{id:'Cle',type:'Text'},{id:'Auteur_Texte',type:'Text'},{id:'Relecteur',type:'Ref:'+T.P},{id:'Agent',type:'Ref:'+T.P},{id:'Etape',type:'Text'},{id:'Texte',type:'Text'},{id:'Extrait',type:'Text'},{id:'Type_Erreur',type:'Choice',widgetOptions:JSON.stringify({choices:RTYPES})},{id:'Etat',type:'Choice',widgetOptions:JSON.stringify({choices:['Ouverte','Résolue','Supprimée']})},{id:'Date',type:'DateTime:Europe/Paris'}]]);
  if(!ids.includes(RT.F)){await act(['AddTable',RT.F,[{id:'Version',type:'Ref:'+RT.V},{id:'Dossier',type:'Ref:'+T.D},{id:'Contenu',type:'Text'},{id:'Taille',type:'Int'}]]);
    try{const tb=rowsOf(await grist.docApi.fetchTable('_grist_Tables')).find(t=>t.tableId==RT.F);if(tb)await act(['UpdateRecord','_grist_Tables',tb.id,{onDemand:true}])}catch(e){}}
  if(!ids.includes(SESS_TABLE))await act(['AddTable',SESS_TABLE,[{id:'Session',type:'Text'},{id:'Dossier',type:'Int'},{id:'As',type:'Int'},{id:'Donnees',type:'Text'},{id:'Date',type:'Numeric'}]])}
async function importRapport(r,bytes){await repTables();await loadRep();const a=actor(),num=(S.repV[r.id]||0)+1;
  const res=await act(['AddRecord',RT.V,null,{Dossier:r.id,Numero:num,Etape:r.Statut||'',Auteur:a&&a.id?a.id:0,Date:Date.now()/1000,Nb_Commentaires:0,Nb_Modifs_Suivies:0,Note:'Rapport joint à l’envoi en relecture'}]);
  const vid=res&&res.retValues?res.retValues[0]:null;
  await act(['AddRecord',RT.F,null,{Version:vid,Dossier:r.id,Contenu:b64(bytes),Taille:bytes.length}]);S.repV[r.id]=num}
/* ============ ÉDITEUR DE RAPPORT (onglet plein écran) ============ */
const EDITEUR=window.__EDITEUR||'https://batex23.github.io/gprev-rapport/index.html';
const SESS_TABLE='Rapports_Sessions';
const b64u={enc:u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),dec:x=>Uint8Array.from(atob(x.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))};
async function seal(raw,obj){const k=await crypto.subtle.importKey('raw',b64u.dec(raw),'AES-GCM',false,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));
  const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj))));const o=new Uint8Array(12+c.length);o.set(iv);o.set(c,12);return b64u.enc(o)}
const TL={win:null,sess:null,key:null,rowId:null,timer:null,rid:null,seen:0};
const tlAlive=()=>!!TL.sess&&Date.now()-TL.seen<30000&&TL.win&&!TL.win.closed;
const tlRec=()=>S.recs.find(x=>x.id==TL.rid)||null;
function tlSend(m){try{TL.win.postMessage(Object.assign({t:TL.sess},m),'*')}catch(e){}}
/* Chrome / Edge : l'onglet envoie ses demandes ici, on les exécute avec l'API Grist */
window.addEventListener('message',async e=>{const d=e.data;
  if(!TL.win||e.source!==TL.win||!d||!d.fromTab||d.t!==TL.sess)return;TL.seen=Date.now();
  if(d.hello)return tlSend({ev:'record',rec:tlRec(),as:(actor()||{}).id||0});
  if(!d.m||!['fetchTable','listTables','applyUserActions','getAccessToken'].includes(d.m))return;
  try{const r=await grist.docApi[d.m](...(d.a||[]));tlSend({id:d.id,ok:true,r})}catch(er){tlSend({id:d.id,ok:false,err:String(er&&er.message||er)})}});
/* Firefox : l'onglet passe par l'API REST ; on lui dépose un jeton renouvelé et chiffré */
async function tlSession(withTok){if(!TL.sess)return;
  const f={Session:TL.sess,Dossier:TL.rid||0,As:(actor()||{}).id||0,Date:Date.now()/1000};
  if(withTok){const t=await grist.docApi.getAccessToken({readOnly:false});TL.base=t.baseUrl;TL.tok=t.token;f.Donnees=await seal(TL.key,{t:t.token})}
  if(TL.rowId)await act(['UpdateRecord',SESS_TABLE,TL.rowId,f]);else{const x=await act(['AddRecord',SESS_TABLE,null,f]);TL.rowId=x&&x.retValues?x.retValues[0]:null}}
function openRapport(id){
  if(!S.repV[id]){
    /* pas encore de rapport : on l'importe d'abord */
    const r=S.recs.find(x=>x.id==id),inp=document.createElement('input');inp.type='file';inp.accept='.odt,application/vnd.oasis.opendocument.text';
    inp.onchange=async()=>{const fl=inp.files[0];if(!fl)return;if(!/\.odt$/i.test(fl.name))return toast('Choisissez un fichier .odt',true);
      try{await importRapport(r,new Uint8Array(await fl.arrayBuffer()));renderDetailNow();
        openM(`<h2>Rapport importé</h2><p>Le fichier est devenu la version 1 du rapport.</p><div class="mact"><button class="btn" id="ro_n">Fermer</button><button class="btn p" id="ro_y">Ouvrir le rapport ↗</button></div>`,'sm');
        $('ro_n').onclick=closeM;$('ro_y').onclick=()=>{closeM();openRapport(id)}}
      catch(e){toast('Import impossible : '+(e.message||e),true)}};
    toast('Ce dossier n’a pas encore de rapport : choisissez le fichier .odt');inp.click();return}
  openTabFor(id,false)}
function openTabFor(id,forceNew){
  TL.rid=id;
  if(!forceNew&&TL.sess&&TL.win&&!TL.win.closed){tlSend({ev:'record',rec:tlRec(),as:(actor()||{}).id||0});tlSession(false).catch(()=>{});try{TL.win.focus()}catch(e){}return}
  /* Firefox : l'onglet déjà ouvert n'est plus joignable directement ; il lit le dossier dans la session */
  if(!forceNew&&TL.sess&&TL.rowId&&/Firefox\//.test(navigator.userAgent)){
    tlSession(false).catch(()=>{});
    const r=tlRec();
    openM(`<h2>Rapport</h2><p>L’onglet <b>Rapport GPREV</b> déjà ouvert passe sur <b>${esc(r?(r.Nom_Dossier||nomDossier(r)):'ce dossier')}</b> dans quelques secondes.</p><p>Si vous l’avez fermé, ouvrez-en un nouveau.</p><div class="mact"><button class="btn" id="ro_n">Fermer</button><button class="btn p" id="ro_new">Ouvrir un nouvel onglet ↗</button></div>`,'sm');
    $('ro_n').onclick=closeM;$('ro_new').onclick=()=>{closeM();openTabFor(id,true)};return}
  const w=window.open('',forceNew?'_blank':'gprev-rapport');
  if(!w)return toast('Le navigateur a bloqué l’onglet : autorisez les fenêtres pop-up pour Grist, puis recliquez.',true);
  try{w.document.title='Rapport GPREV';w.document.body.innerHTML='<p style="font:16px system-ui;padding:40px">Ouverture du rapport…</p>'}catch(e){}
  TL.win=w;TL.sess=Math.random().toString(36).slice(2,10);TL.seen=Date.now();TL.rowId=null;TL.key=b64u.enc(crypto.getRandomValues(new Uint8Array(32)));
  (async()=>{
    try{await repTables();await tlSession(true)}
    catch(e){console.warn('Session non enregistrée (utile pour Firefox)',e);try{const t=await grist.docApi.getAccessToken({readOnly:false});TL.base=t.baseUrl;TL.tok=t.token}catch(e2){}}
    const u=new URL(EDITEUR);u.searchParams.set('onglet',TL.sess);
    u.hash=new URLSearchParams({b:TL.base||'',j:TL.tok||'',k:TL.key,d:id,as:(actor()||{}).id||0}).toString();
    try{w.location.href=u.href}catch(e){window.open(u.href,'gprev-rapport')}
    clearInterval(TL.timer);TL.timer=setInterval(()=>tlSession(true).catch(e=>console.warn('renouvellement',e)),180000)})()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-rap]');if(b){e.preventDefault();openRapport(+b.dataset.rap)}});

function finish(id){const av=$('avS').value;if(!av)return toast('Choisissez un avis (favorable ou défavorable)',true);
  if(!$('resS').checked)return toast('Confirmez que les pièces sont sur le réseau',true);
  const r=S.recs.find(x=>x.id==id),g=r&&r.Retour_Groupement;
  const go=()=>{const f={Avis:av,Pieces_Reseau:true,Date_Termine_Agent:todayU(),Statut:g?'Relecture chef de groupement':'Relecture chef de service'};
    if(r&&'Retour_Groupement' in r)f.Retour_Groupement=false;
    upd(id,f,g?'Renvoyé au chef de groupement':'Envoyé en relecture')};
  const pickOdt=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.odt,application/vnd.oasis.opendocument.text';
    inp.onchange=async()=>{const fl=inp.files[0];if(!fl)return;
      if(!/\.odt$/i.test(fl.name))return toast('Choisissez le rapport au format .odt',true);
      try{toast('Import du rapport…');await importRapport(r,new Uint8Array(await fl.arrayBuffer()));closeM();go()}
      catch(e){console.error(e);toast('Import du rapport impossible : '+(e.message||e),true)}};inp.click()};
  /* l'instructeur joint son rapport .odt ; s'il l'a rédigé dans l'éditeur, il peut transmettre la version déjà enregistrée */
  loadRep().then(()=>{const n=S.repV[id]||0;
  openM(`<h2>Rapport à transmettre</h2><p>${g?'Le dossier part en relecture chez le <b>chef de groupement</b>.':'Le dossier part en relecture chez le <b>chef de service</b>.'}</p>
    <p>${n?`La <b>version ${n}</b> du rapport est déjà dans Grist. Joignez votre fichier si vous avez travaillé dans OpenOffice.`:'Joignez le rapport <b>.odt</b> que vous avez rédigé : il deviendra la version 1.'}</p>
    <div class="mact"><button class="btn" id="rt_n">Annuler</button>${n?`<button class="btn" id="rt_keep">Transmettre la version ${n}</button>`:''}<button class="btn p" id="rt_file">Joindre le rapport .odt…</button></div>`,'sm');
  $('rt_n').onclick=closeM;$('rt_file').onclick=pickOdt;if(n)$('rt_keep').onclick=()=>{closeM();go()}})}
async function back(id,grp){
  const t=await ask({title:'Renvoyer à l’agent',label:'Motif du renvoi (obligatoire, visible par l’agent)',ok:'Renvoyer',area:true});if(!t)return;
  try{await addComRaw(id,'Renvoi à l’agent : '+t,true);
    const r=S.recs.find(x=>x.id==id),f={Statut:'À reprendre'};if(r&&'Retour_Groupement' in r)f.Retour_Groupement=grp;
    else if(grp)toast('Colonne Retour_Groupement (Oui/Non) absente : au retour, le dossier repassera par le chef de service',true);
    await upd(id,f,'Renvoyé à l’agent');await loadComs();renderComs();renderList()}catch(e){toast('Renvoi refusé : '+e.message,true)}}
function addComRaw(id,t,imp){const a=actor();return act(['AddRecord',T.C,null,{Dossier:id,Auteur:a?a.id:0,Date:Math.floor(Date.now()/1000),Texte:t,Important:!!imp}])}
async function addCom(id){const el=$('ctxt'),t=el.value.trim();if(!t)return;
  try{await addComRaw(id,t,$('cimp').checked);el.value='';delete S.draft[id];$('cimp').checked=false;await loadComs();renderComs();renderList();toast('Commentaire publié')}
  catch(e){toast('Commentaire refusé : '+(e.message||e),true)}}

/* ============ FENÊTRES ============ */
function openM(h,cls=''){$('mbox').className='mbox '+cls;$('mbox').innerHTML=h;$('modal').classList.add('on')}
function closeM(){$('modal').classList.remove('on');$('mbox').innerHTML=''}
function ask({title,label,ok='Valider',area=false}){return new Promise(res=>{
  openM(`<h2>${title}</h2><label class="lb" for="ask_t">${label}</label>${area?'<textarea id="ask_t" rows="3"></textarea>':'<input id="ask_t">'}<div class="mact"><button class="btn" id="ask_n">Annuler</button><button class="btn p" id="ask_y">${ok}</button></div>`,'sm');
  const t=$('ask_t');t.focus();const done=v=>{closeM();res(v)};
  $('ask_n').onclick=()=>done(null);$('ask_y').onclick=()=>{const v=t.value.trim();if(!v){t.focus();return}done(v)}})}
function sure(msg,ok){return new Promise(res=>{openM(`<h2>Confirmation</h2><p>${msg}</p><div class="mact"><button class="btn" id="c_n">Annuler</button><button class="btn d" id="c_y">${ok}</button></div>`,'sm');
  $('c_n').onclick=()=>{closeM();res(false)};$('c_y').onclick=()=>{closeM();res(true)}})}
$('modal').addEventListener('mousedown',e=>{if(e.target.id=='modal'&&!$('mbox').querySelector('#impFile,#itab'))closeM()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&$('modal').classList.contains('on')&&!$('mbox').querySelector('#itab'))closeM()});

/* ============ RÉPARATION : dossiers mis en relecture par un import (et non par l'agent) ============ */
const RELST=['Relecture chef de service','Relecture chef de groupement'];
const relSeen=()=>{try{return new Set(JSON.parse(localStorage.getItem('relfix_seen')||'[]'))}catch(e){return new Set()}};
/* « Envoyer en relecture » (agent) exige un avis et ne pose jamais de clé d'import ; l'import pose une clé et date la fin de l'agent à la date d'arrivée faute de mieux */
const relSure=r=>emptyV(r.Avis)||(r.Date_Termine_Agent&&r.Date_Arrivee&&r.Date_Termine_Agent==r.Date_Arrivee);
const relSuspects=()=>S.recs.filter(r=>real(r)&&RELST.includes(r.Statut)&&!emptyV(r.Cle_Import));
function relBanner(w){const a=actor(),seen=relSeen(),L=relSuspects().filter(r=>!seen.has(r.id));
  if(!L.length||!(isGrp(a)||isChef(a))){w.hidden=true;return}
  const sure=L.filter(relSure).length;
  w.hidden=false;w.innerHTML=`${L.length} dossier(s) en relecture proviennent d’un import Prevarisc${sure?`, dont <b>${sure} sans aucun envoi de l’agent</b>`:''} : ils ont pu être placés là automatiquement. <button class="btn p" id="relFix" style="margin-left:8px">Vérifier</button>`;
  $('relFix').onclick=openRelFix}
function openRelFix(){const seen=relSeen(),L=relSuspects().filter(r=>!seen.has(r.id)).sort((a,b)=>relSure(b)-relSure(a));
  openM(`<h2>Dossiers en relecture issus d’un import</h2>
   <p style="color:var(--mut);margin:0 0 10px">Les dossiers cochés n’ont pas été envoyés en relecture par l’agent (pas d’avis saisi dans Grist, ou date de fin = date d’arrivée). Ils repasseront <b>En cours</b> chez leur agent (ou au service s’il n’y a pas d’agent), avec un commentaire de traçabilité. Les dossiers décochés restent en relecture et ne seront plus signalés.</p>
   <div class="itw" style="max-height:380px"><table class="itab"><thead><tr><th></th><th>Dossier</th><th>Statut</th><th>Agent</th><th>Avis</th><th>Arrivée</th><th>Fin agent</th></tr></thead><tbody>
   ${L.map(r=>`<tr><td><input type="checkbox" data-rf="${r.id}" ${relSure(r)?'checked':''}></td><td class="nmc">${esc(r.Nom_Dossier||nomDossier(r))}</td><td>${esc(r.Statut)}</td><td>${esc(nom(r.Agent_Assigne))}</td><td>${esc(r.Avis||'—')}</td><td>${fd(r.Date_Arrivee)}</td><td>${fd(r.Date_Termine_Agent)}</td></tr>`).join('')}</tbody></table></div>
   <div class="mact"><button class="btn" onclick="closeM()">Plus tard</button><button class="btn p" id="rfGo">Appliquer</button></div>`);
  $('rfGo').onclick=async()=>{const btn=$('rfGo');btn.disabled=true;btn.textContent='Correction…';
    const ids=[...document.querySelectorAll('[data-rf]')].filter(x=>x.checked).map(x=>+x.dataset.rf),cols=dcols();
    try{const ups=ids.map(id=>{const r=S.recs.find(x=>x.id==id),f={Statut:r.Agent_Assigne?'En cours':r.Service_Attribue?'Attribué service':'Reçu SAF'};
        if(cols.includes('Date_Termine_Agent'))f.Date_Termine_Agent=null;if(cols.includes('Pieces_Reseau'))f.Pieces_Reseau=false;return['UpdateRecord',T.D,id,f]});
      for(let i=0;i<ups.length;i+=100)await grist.docApi.applyUserActions(ups.slice(i,i+100));
      if(S.comOk)for(const id of ids)try{await addComRaw(id,'Remis en cours : ce dossier avait été placé en relecture par un import Prevarisc, sans envoi de l’agent.',false)}catch(e){}
      const seen=relSeen();L.forEach(r=>seen.add(r.id));try{localStorage.setItem('relfix_seen',JSON.stringify([...seen]))}catch(e){}
      closeM();toast(`${ids.length} dossier(s) remis en cours`)}
    catch(e){btn.disabled=false;btn.textContent='Appliquer';toast('Correction refusée : '+(e.message||e),true)}}}
/* ============ IMPORT (export Prevarisc ou CSV simple) ============ */
const IMP={rows:[],opt:{makeSC:true,done:'Clôturé',pend:'En cours',fix:false,upd:true,mkAg:false,keepAg:true,adv:false}};
const cleanAgent=t=>String(t||'').replace(/\(+[^)]*\)+/g,' ').replace(/\s+/g,' ').trim();
function splitName(n){const w=cleanAgent(n).split(' ').filter(Boolean),u=w.filter(x=>x==x.toUpperCase()&&/[A-ZÀ-Ý]/.test(x)),l=w.filter(x=>!u.includes(x));return{nom:(u.join(' ')||w[0]||n).toUpperCase(),prenom:l.join(' ')||(u.length?'':w.slice(1).join(' '))}}
function openImport(){
  openM(`<h2>Importer des dossiers</h2>

async function commitImport(){

        await act(['BulkAddRecord',T.P,rows.map(()=>null),o]);nAg=names.length;
        S.pers={};rowsOf(await grist.docApi.fetchTable(T.P)).forEach(p=>S.pers[p.id]=p);
        NEW.concat(UPD).forEach(r=>{if(r.agentTxt&&!r.agent){const p=findAgent(r.agentTxt);if(p)r.agent=p.id}})}}
    if(IMP.opt.makeSC){
      const miss=[...new Set(NEW.concat(UPD).filter(r=>r.scDate&&!Object.values(S.scs).some(s=>s.Date==r.scDate)).map(r=>r.scDate))].sort();
      if(miss.length){await act(['BulkAddRecord',T.S,miss.map(()=>null),{Date:miss,Libelle:miss.map(()=>'Commission départementale')}]);await loadSC()}}
    const byDate={};Object.values(S.scs).forEach(s=>byDate[s.Date]=s.id);
    const mk=r=>mkRec(r,byDate);
    let ign=[];
    if(NEW.length){const recs=NEW.map(mk),all=Object.keys(recs[0]),cols=all.filter(c=>avail.includes(c));
      ign=all.filter(c=>!avail.includes(c)&&recs.some(x=>x[c]));
      for(let i=0;i<recs.length;i+=100){const ch=recs.slice(i,i+100),o={};cols.forEach(c=>o[c]=ch.map(x=>x[c]));await act(['BulkAddRecord',T.D,ch.map(()=>null),o])}}
    if(UPD.length){UPD.forEach(setUpd);const L=UPD.filter(r=>r.upd);
      for(let i=0;i<L.length;i+=100){const ch=L.slice(i,i+100).map(r=>['UpdateRecord',T.D,r.match.id,r.fill]);await grist.docApi.applyUserActions(ch)}UPD.length=0;UPD.push(...L)}
    closeM();
    toast(`${NEW.length} créés${UPD.length?' · '+UPD.length+' mis à jour':''}${nAg?' · '+nAg+' agents ajoutés':''}${ign.length?' · colonnes absentes ignorées : '+ign.join(', '):''}`);
  }catch(e){btn.disabled=false;btn.textContent='Réessayer l’import';toast('Import refusé : '+(e.message||e),true)}}

function statData(){
  const t=todayU(),d=new Date(t*1000),y=d.getUTCFullYear(),mo=d.getUTCMonth();
  const from={year:Date.UTC(y,0,1)/1000,month:Date.UTC(y,mo,1)/1000,d30:t-30*86400,all:0}[S.sp||'year'];

  pool().forEach(r=>{const k=gkey(r),o=by[k]=by[k]||z(),st=r.Statut;
    if(ACTIVE.includes(st)){o.todo++;tot.todo++;if(st=='En attente agent'){o.att++;tot.att++}}
    if(TREATED.includes(st)){const dt=r.Date_Termine_Agent||r.Date_Cloture||r.Date_Arrivee||0;if(!from||dt>=from)[o,tot].forEach(x=>{x.done++;
      if(r.Avis=='Favorable')x.fav++;else if(r.Avis=='Défavorable')x.def++;x.der+=r.Nb_Derogations||0;x.dem+=r.Nb_Demandes_Avis||0;

  return{rows,tot}}

const chargeDoss=r=>(WCAT[r.Categorie]??1)+(r.Nb_Derogations||0)+(r.Nb_Demandes_Avis||0)+(r.Sous_Commission?1:0);

const yOf=t=>{const y=t?new Date(t*1000).getUTCFullYear():0;return y>1990&&y<2100?y:0},mOf=t=>t?new Date(t*1000).getUTCMonth():-1;

const med=a=>{if(!a.length)return null;a=a.slice().sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};

function dashStats(L){const o={n:0,fav:0,def:0,sans:0,der:0,dem:0,sc:0,ch:0,c:{},nat:{},delays:[],ok:0,okN:0,clos:0};

    o.der+=r.Nb_Derogations||0;o.dem+=r.Nb_Demandes_Avis||0;if(r.Sous_Commission)o.sc++;o.ch+=chargeDoss(r);if(r.Statut=='Clôturé')o.clos++;
    const c=r.Categorie||'—';o.c[c]=(o.c[c]||0)+1;const n=r.Nature||'—';o.nat[n]=(o.nat[n]||0)+1;
    if(r.Avis&&r.Date_Termine_Agent&&r.Date_Arrivee&&r.Date_Termine_Agent>=r.Date_Arrivee){o.delays.push((r.Date_Termine_Agent-r.Date_Arrivee)/86400);const e=echOf(r);if(e){o.okN++;if(r.Date_Termine_Agent<=e)o.ok++}}});

  const x=S.scs[scid];if(!x)return;
  try{await loadPdfLib();const{PDFDocument,StandardFonts,rgb}=PDFLib,doc=await PDFDocument.create(),F=await doc.embedFont(StandardFonts.Helvetica),B=await doc.embedFont(StandardFonts.HelveticaBold);
    const L=seanceRows(scid,true),W=841.89,H=595.28,M=34,clean=t=>String(t??'').replace(/[\r\n]+/g,' ').replace(/[^\x20-\x7E\xA0-\xFF‘’“”–—…€]/g,'').trim();
    const cols=[['N°',28,'c'],['Dossier',370,'l'],['Agent',180,'l'],['Avis',80,'l'],['Dérog.',50,'c'],['Dem. avis',61,'c']],TW=cols.reduce((a,c)=>a+c[1],0);
    const wrap=(t,w,font,sz)=>{const out=[];let cur='';clean(t).split(' ').forEach(wd=>{let nx=cur?cur+' '+wd:wd;if(font.widthOfTextAtSize(nx,sz)<=w){cur=nx;return}
        if(cur)out.push(cur);cur=wd;while(font.widthOfTextAtSize(cur,sz)>w&&cur.length>1){let k=cur.length-1;while(k>1&&font.widthOfTextAtSize(cur.slice(0,k),sz)>w)k--;out.push(cur.slice(0,k));cur=cur.slice(k)}});if(cur)out.push(cur);return out.length?out:['']};
    const nD=L.filter(r=>r.Avis=='Défavorable').length,nF=L.filter(r=>r.Avis=='Favorable').length,nDr=L.reduce((a,r)=>a+(r.Nb_Derogations||0),0),nDm=L.reduce((a,r)=>a+(r.Nb_Demandes_Avis||0),0);
    const ink=rgb(.1,.13,.18),blue=rgb(.14,.31,.56),red=rgb(.7,.15,.12),grey=rgb(.45,.48,.52);
    let page,y;const pages=[];
    const newPage=(first)=>{page=doc.addPage([W,H]);pages.push(page);y=H-M;
      if(first){page.drawText(clean('Sous-commission départementale du '+fd(x.Date)),{x:M,y:y-16,size:17,font:B,color:blue});y-=26;
        if(x.Libelle)page.drawText(clean(x.Libelle),{x:M,y:y-10,size:10,font:F,color:grey}),y-=14;
        page.drawText(clean(`Ordre de passage · ${L.length} dossier${L.length>1?'s':''} · ${nF} favorable${nF>1?'s':''} · ${nD} défavorable${nD>1?'s':''} · ${nDr} dérogation${nDr>1?'s':''} · ${nDm} demande${nDm>1?'s':''} d’avis`),{x:M,y:y-10,size:10,font:F,color:ink});y-=24}
      else y-=4;
      page.drawRectangle({x:M,y:y-18,width:TW,height:18,color:blue});let cx=M;
      cols.forEach(c=>{const t=clean(c[0]),w=B.widthOfTextAtSize(t,9);page.drawText(t,{x:c[2]=='c'?cx+(c[1]-w)/2:cx+5,y:y-13,size:9,font:B,color:rgb(1,1,1)});cx+=c[1]});y-=18};
    newPage(true);
    L.forEach((r,i)=>{const p=r.Agent_Assigne&&S.pers[r.Agent_Assigne],name=wrap(r.Nom_Dossier||nomDossier(r),cols[1][1]-10,F,9),ag=wrap(p?fullName(p):'Non attribué',cols[2][1]-10,F,9),n=Math.max(name.length,ag.length),h=n*11+6;
      if(y-h<M+16)newPage(false);
      if(i%2)page.drawRectangle({x:M,y:y-h,width:TW,height:h,color:rgb(.95,.96,.98)});
      const avis=r.Avis=='Favorable'?'Favorable':r.Avis=='Défavorable'?'Défavorable':'À rendre',ac=r.Avis=='Défavorable'?red:r.Avis=='Favorable'?rgb(.1,.45,.3):grey;
      let cx=M;const cell=(k,txt,font,color)=>{const w=cols[k][1];if(cols[k][2]=='c'){const t=clean(txt),tw=font.widthOfTextAtSize(t,9);page.drawText(t,{x:cx+(w-tw)/2,y:y-12,size:9,font,color})}else(Array.isArray(txt)?txt:[txt]).forEach((ln,j)=>page.drawText(clean(ln),{x:cx+5,y:y-12-j*11,size:9,font,color}));cx+=w};
      cell(0,String(i+1),B,ink);cell(1,name,F,ink);cell(2,ag,F,ink);cell(3,avis,r.Avis=='Défavorable'?B:F,ac);cell(4,r.Nb_Derogations?String(r.Nb_Derogations):'',B,red);cell(5,r.Nb_Demandes_Avis?String(r.Nb_Demandes_Avis):'',B,red);
      page.drawLine({start:{x:M,y:y-h},end:{x:M+TW,y:y-h},thickness:.4,color:rgb(.82,.84,.87)});y-=h});
    if(!L.length)page.drawText('Aucun dossier rattaché à cette séance.',{x:M,y:y-16,size:10,font:F,color:grey});
    const st=clean('Édité le '+new Date().toLocaleDateString('fr-FR')+' · '+scopeLabel());
    pages.forEach((pg,i)=>{pg.drawText(st,{x:M,y:18,size:8,font:F,color:grey});const t=`Page ${i+1} / ${pages.length}`;pg.drawText(t,{x:W-M-F.widthOfTextAtSize(t,8),y:18,size:8,font:F,color:grey})});
    const bytes=await doc.save(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download='sous-commission-'+iso(x.Date)+'.pdf';document.body.appendChild(a);a.click();a.remove();toast('PDF généré')
  }catch(e){toast('PDF impossible : '+(e.message||e),true)}}

/* ============ ORDRE DU JOUR (liste collée depuis Prevarisc) ============ */
const ODJ={rows:[],mk:false};
function parseOdj(txt){const L=String(txt||'').split(/\r?\n/),out=[];
  for(let i=0;i<L.length;i++){
    const m=L[i].match(/^\s*\[(.*)\]\s*[ÉE]tude\s*-\s*(.+?)\s*\((AT|PC|DP|PA|PD|CU)\)\s*-\s*(.*?)\s+ayant pour date de passage en commission le (\d{2}\/\d{2}\/\d{4})\s*$/i);if(!m)continue;
    let mid=m[4],ag='';const a=mid.match(/\(([^()]+)\)\s*$/);if(a){ag=a[1].trim();mid=mid.slice(0,a.index).trim()}
    const h=mid.match(/^(\d{3,})\s*-\s*(.*)$/),dem=/^DEMAT/i.test(mid);
    const nxt=(L[i+1]||'')+' '+(L[i+2]||''),pl=(nxt.match(/PLATAU\s*:\s*([A-Z0-9]{2,4}(?:-[A-Z0-9]{2,4}){1,3})/i)||[])[1]||'';
    out.push({etab:m[1].trim(),type:m[3].toUpperCase(),airs:h?h[1]:'',demat:dem||!h,objet:(h?h[2]:mid).trim(),agent:ag,plateau:pl,date:parseDate(m[5])})}
  return out}
function matchOdj(o){const all=S.recs.filter(real),pick=c=>c.sort((a,b)=>(a.Statut=='Clôturé')-(b.Statut=='Clôturé')||b.id-a.id)[0]||null;
  let c=[];if(o.airs)c=all.filter(r=>String(r.Numero_AIRS||'').replace(/\D/g,'')==o.airs);
  if(!c.length&&o.plateau)c=all.filter(r=>String(r.Objet||'').toUpperCase().includes(o.plateau.toUpperCase())||String(r.Numero_Courrier||'').toUpperCase().includes(o.plateau.toUpperCase()));
  if(!c.length&&o.etab&&norm(o.etab).length>5)c=all.filter(r=>norm(r.Etablissement)==norm(o.etab)&&(o.airs?true:r.Source=='DEMAT'));
  return{r:pick(c),n:c.length}}
function openOdj(txt){
  openM(`<h2>Coller l’ordre du jour d’une sous-commission</h2><p style="color:var(--mut);margin:0 0 10px">Collez la liste Prevarisc (« [Établissement] Étude - … ayant pour date de passage en commission le … »). Les dossiers trouvés dans Grist seront rattachés à la séance correspondante.</p>
   <textarea id="odjT" rows="9" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--soft);color:var(--ink);font:12.5px var(--font)" placeholder="Collez ici…">${esc(txt||'')}</textarea>
   <div id="odjP"></div><div class="mact"><button class="btn" onclick="closeM()">Annuler</button><button class="btn p" id="odjGo" disabled>Rattacher</button></div>`);
  const draw=()=>{const R=ODJ.rows=parseOdj($('odjT').value).map(o=>({o,...matchOdj(o)}));
    const ok=R.filter(x=>x.r),dates=[...new Set(R.map(x=>x.o.date))],ko=R.filter(x=>!x.r),already=ok.filter(x=>x.r.Sous_Commission&&scDateOf(x.r)==x.o.date);
    $('odjP').innerHTML=R.length?`<div class="sumrow" style="margin-top:10px"><span class="pill" style="--c:var(--cours)">${R.length} dossiers lus</span><span class="pill" style="--c:var(--ok)">${ok.length} trouvés dans Grist</span>${already.length?`<span class="pill" style="--c:var(--clos)">${already.length} déjà rattachés</span>`:''}<span class="pill" style="--c:var(--soon)">${ko.length} introuvables</span><span class="pill" style="--c:var(--svc)">séance(s) : ${dates.map(fd).join(', ')}</span></div>
     ${ko.length?`<label style="display:flex;gap:8px;align-items:flex-start;margin:6px 0"><input type="checkbox" id="odjMk" ${ODJ.mk?'checked':''} style="margin-top:3px"><span>Créer les ${ko.length} dossiers introuvables (fiche minimale à compléter : établissement, n° AIRS, agent, objet), rattachés à la séance.</span></label>`:''}
     <div class="itw" style="max-height:260px"><table class="itab"><thead><tr><th>Établissement</th><th>Dossier</th><th>Agent (Prevarisc)</th><th>Dans Grist</th></tr></thead><tbody>${R.map(x=>`<tr><td class="nmc">${esc(x.o.etab)}</td><td>${x.o.airs?'AIRS '+esc(x.o.airs):'DEMAT '+esc(x.o.plateau)}</td><td>${esc(x.o.agent)}</td><td>${x.r?`<span class="pas ok">${esc(x.r.Nom_Dossier||nomDossier(x.r))}${x.n>1?' ('+x.n+' correspondances)':''}</span>`:'<span class="pas soon">introuvable</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="note" style="margin-top:8px">Aucune ligne reconnue pour l’instant.</div>';
    $('odjGo').disabled=!R.length;if($('odjMk'))$('odjMk').onchange=e=>{ODJ.mk=e.target.checked}};
  $('odjT').oninput=draw;draw();
  $('odjGo').onclick=async()=>{const R=ODJ.rows,btn=$('odjGo');btn.disabled=true;btn.textContent='Rattachement…';
    try{const dates=[...new Set(R.map(x=>x.o.date))].filter(Boolean);let miss=dates.filter(d=>!Object.values(S.scs).some(x=>x.Date==d));
      if(miss.length){await act(['BulkAddRecord',T.S,miss.map(()=>null),{Date:miss,Libelle:miss.map(()=>'Commission départementale')}]);await loadSC()}
      const by={};Object.values(S.scs).forEach(x=>by[x.Date]=x.id);const cols=dcols();let n=0,c=0;
      const ups=R.filter(x=>x.r&&x.r.Sous_Commission!=by[x.o.date]).map(x=>['UpdateRecord',T.D,x.r.id,{Sous_Commission:by[x.o.date]}]);
      for(let i=0;i<ups.length;i+=100){await grist.docApi.applyUserActions(ups.slice(i,i+100));n+=Math.min(100,ups.length-i)}
      if(ODJ.mk){const adds=R.filter(x=>!x.r).map(x=>{const o=x.o,p=findAgent(cleanAgent(o.agent)),f={Source:o.airs?'AIRS':'DEMAT',Numero_AIRS:o.airs,Etablissement:o.etab,Nature:'ERP',Statut:'Attribué service',
          Service_Attribue:p&&['BMET','PMET','Chargé de mission'].includes(p.Service)?p.Service:'',Sous_Commission:by[o.date],Objet:(o.objet+(o.plateau?'\nCONSULTATION PLATAU : '+o.plateau:'')+(o.agent?'\nPréventionniste Prevarisc : '+o.agent:'')).slice(0,1500),Cle_Import:'ODJ|'+(o.airs||o.plateau||norm(o.etab))+'|'+iso8(o.date)};
          Object.keys(f).forEach(k=>{if(!cols.includes(k))delete f[k]});return['AddRecord',T.D,null,f]});
        for(let i=0;i<adds.length;i+=100){await grist.docApi.applyUserActions(adds.slice(i,i+100));c+=Math.min(100,adds.length-i)}}
      closeM();toast(`${n} dossiers rattachés${c?' · '+c+' créés':''}`);S.stage='sc';render()}
    catch(e){btn.disabled=false;btn.textContent='Rattacher';toast('Refusé : '+(e.message||e),true)}}}
